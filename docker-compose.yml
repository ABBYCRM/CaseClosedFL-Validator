services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: caseclosed_validator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["ccv_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caseclosed_validator"]
      interval: 5s
      timeout: 5s
      retries: 10
  validator:
    build: .
    env_file: .env
    environment:
      # Compose service hostname; .env localhost is for host-side npm scripts.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/caseclosed_validator
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
    # OSINT CLIs are on PATH in this image. Enable with OSINT_IDENTITY_ENABLED=true
    # in .env — no OSINT_DOCKER_IMAGE / docker-in-docker required.
  # The validator image (build: .) already bakes Holehe, PhoneInfoga, Mosint, and
  # h8mail onto PATH. Set OSINT_IDENTITY_ENABLED=true on that service for local
  # compose. This sidecar is optional host-docker fallback only — not used on
  # DigitalOcean App Platform (no docker-in-docker). Paid OSINT APIs are out of scope.
  osint-cli:
    profiles: ["osint"]
    build:
      context: ./docker/osint
    image: caseclosedfl-osint:local
    network_mode: bridge
    command: ["sleep","infinity"]
volumes:
  ccv_pg: {}
