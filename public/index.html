<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaseClosedFL-Validator Tokens</title><style>body{font-family:system-ui,sans-serif;max-width:920px;margin:40px auto;padding:0 20px}input,button{padding:10px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.token{word-break:break-all;background:#f4f4f4;padding:12px}.muted{opacity:.7}</style></head><body>
<h1>CaseClosedFL-Validator</h1><p class="muted">Token administration only. Token plaintext is shown once and never stored.</p>
<div><input id="secret" type="password" placeholder="Admin secret"><input id="name" placeholder="Token name" value="Main Agent"><label><input id="validate" type="checkbox" checked>validate</label><label><input id="read" type="checkbox" checked>read-result</label><button onclick="mint()">Create token</button></div>
<div id="newToken"></div><button onclick="load()">Refresh tokens</button><table><thead><tr><th>Name</th><th>Prefix</th><th>Scopes</th><th>Created</th><th>Last used</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<script>
const h=()=>({'content-type':'application/json','x-admin-secret':document.getElementById('secret').value});
async function load(){const r=await fetch('/admin/tokens',{headers:h()});if(!r.ok)return alert('Unauthorized or server error');const x=await r.json();rows.innerHTML=x.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.prefix)}</td><td>${esc(t.scopes.join(','))}</td><td>${new Date(t.created_at).toLocaleString()}</td><td>${t.last_used_at?new Date(t.last_used_at).toLocaleString():'Never'}</td><td>${t.revoked_at?'Revoked':`<button onclick="revoke('${t.id}')">Revoke</button>`}</td></tr>`).join('')}
async function mint(){const scopes=[];if(validate.checked)scopes.push('validate');if(read.checked)scopes.push('read-result');const r=await fetch('/admin/tokens',{method:'POST',headers:h(),body:JSON.stringify({name:name.value,scopes})});const x=await r.json();if(!r.ok)return alert(x.error||'Error');newToken.innerHTML=`<h3>Copy now — shown once</h3><div class="token">${esc(x.token)}</div>`;await load()}
async function revoke(id){await fetch('/admin/tokens/'+id,{method:'DELETE',headers:h()});await load()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
